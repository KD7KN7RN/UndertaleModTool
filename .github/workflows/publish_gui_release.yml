name: Publish stable release of UndertaleModTool

on:
  push:
    paths:
      - '.github/final-build-trigger.txt'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. 0.9.1.0)'
        required: true
        default: '1.0.0'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build_avalonia_android:

    strategy:
      fail-fast: false
      matrix:
        rid: [android-arm64, android-x64]
        include:
          - rid: android-arm64
            filename: UndertaleModToolAvalonia_${{ inputs.version || '1.0.0' }}-Android-arm64
          - rid: android-x64
            filename: UndertaleModToolAvalonia_${{ inputs.version || '1.0.0' }}-Android-x64

    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7
      with:
        submodules: true
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x
    - name: Setup JDK
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: 1.4.0
    - name: Build offline Arabic Tenna Editor
      shell: pwsh
      run: |
        Set-Location $env:GITHUB_WORKSPACE\UndertaleModToolAvalonia.Android\TennaEditor
        bun install --frozen-lockfile
        Set-Location $env:GITHUB_WORKSPACE
        node .\scripts\tenna-android-prepare.mjs
        Set-Location $env:GITHUB_WORKSPACE\UndertaleModToolAvalonia.Android\TennaEditor
        bun run build
        Set-Location $env:GITHUB_WORKSPACE
        New-Item -ItemType Directory -Force .\UndertaleModToolAvalonia.Android\Assets\Tenna | Out-Null
        Copy-Item -Path .\UndertaleModToolAvalonia.Android\TennaEditor\dist\* -Destination .\UndertaleModToolAvalonia.Android\Assets\Tenna -Recurse -Force
    - name: Install Android workload
      run: dotnet workload install android
    - name: Publish Avalonia Android APK
      run: |
        dotnet publish UndertaleModToolAvalonia.Android -c Release -r ${{ matrix.rid }} --self-contained true -p:AndroidSdkDirectory="$env:ANDROID_HOME" --output ${{ github.workspace }}\Avalonia-Android-${{ matrix.rid }}
    - name: Copy external files
      shell: pwsh
      run: |
        Copy-Item -Path ./README.md, ./SCRIPTS.md, ./LICENSE.txt -Destination ./Avalonia-Android-${{ matrix.rid }}/
        Remove-Item -Path ./Avalonia-Android-${{ matrix.rid }}/Underanalyzer.pdb -ErrorAction SilentlyContinue
    - name: Create zip for stable release Avalonia Android
      shell: pwsh
      run: |
        # The APK stays inside the zip so the app can update itself on Android (it extracts the
        # APK from the downloaded build and hands it to the system package installer).
        7z a -tzip ${{ matrix.filename }}.zip ./Avalonia-Android-${{ matrix.rid }}/* -mx9
    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.filename }}
        path: ${{ matrix.filename }}.zip



  upload:

    needs: [build_avalonia_android]
    runs-on: ubuntu-latest
    steps:
    - name: Download artifacts
      uses: actions/download-artifact@v8

    - name: Generate release body with build table
      run: |
        cat > release_body.md <<'EOF'
        This is an unofficial version of UndertaleModTool developed by 秋冥散雨_Genouka.

        If you encounter any bugs, please submit an issue to this repository on Github.

        If you're not sure which one to download, please download `UndertaleModTool_${{ inputs.version || '1.0.0' }}-Windows.zip`
        
        这是由 秋冥散雨_Genouka 开发的非官方版本的 UndertaleModTool。
        
        如果你遇到任何Bug ，请在Github 向此仓库提交 Issue 。
        
        如果你不清楚该下载哪个，请下载`UndertaleModTool_${{ inputs.version || '1.0.0' }}-Windows.zip`
        
        ## Available builds
        | Name | Platform | Type | Download |
        |------|----------|------|----------|
        EOF
        # 遍历所有下载的 .zip 文件，生成表格行
        for file in $(find . -name "*.zip" -type f); do
          name=$(basename "$file")
          # 提取平台与图标
          if [[ "$name" =~ Windows ]]; then
            icon="🪟"
            platform="Windows"
          elif [[ "$name" =~ Ubuntu ]] || [[ "$name" =~ Linux ]]; then
            icon="🐧"
            platform="Linux"
          elif [[ "$name" =~ macOS ]]; then
            icon="🍎"
            platform="macOS"
          elif [[ "$name" =~ Android ]]; then
            icon="📱"
            platform="Android"
          else
            icon="❓"
            platform="Unknown"
          fi
          # 提取版本类型
          if [[ "$name" =~ CLI ]]; then
            type="CLI"
          elif [[ "$name" =~ Avalonia ]]; then
            if [[ "$name" =~ Android ]]; then
              type="Avalonia Android"
            else
              type="Avalonia GUI"
            fi
          else
            type="GUI"
          fi
          echo "| $name | $icon $platform | $type | [Download](https://github.com/${{ github.repository }}/releases/download/${{ inputs.version || '1.0.0' }}/$name) |" >> release_body.md
        done
        echo "" >> release_body.md
        echo "## Changelog" >> release_body.md
        echo "[View Changelog](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md)" >> release_body.md
      shell: bash

    - name: Release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ inputs.version || '1.0.0' }}
        name: Release ${{ inputs.version || '1.0.0' }}
        prerelease: false
        fail_on_unmatched_files: true
        files: |
          */*
        body_path: release_body.md
