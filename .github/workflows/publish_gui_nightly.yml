name: Publish Android nightly release of UndertaleModTool

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build_avalonia_android:
    strategy:
      fail-fast: false
      matrix:
        rid: [android-arm64, android-x64]
        include:
          - rid: android-arm64
            filename: UndertaleModToolAvalonia_nightly-Android-arm64
          - rid: android-x64
            filename: UndertaleModToolAvalonia_nightly-Android-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - name: Build offline Arabic Tenna Editor
        shell: pwsh
        run: |
          Set-Location $env:GITHUB_WORKSPACE\External\tenna-editor
          bun install --frozen-lockfile
          Set-Location $env:GITHUB_WORKSPACE
          node .\scripts\tenna-android-prepare.mjs
          Set-Location $env:GITHUB_WORKSPACE\External\tenna-editor
          bun run build
          Set-Location $env:GITHUB_WORKSPACE
          New-Item -ItemType Directory -Force .\UndertaleModToolAvalonia.Android\Assets\Tenna | Out-Null
          Copy-Item -Path .\External\tenna-editor\dist\* -Destination .\UndertaleModToolAvalonia.Android\Assets\Tenna -Recurse -Force
      - name: Install Android workload
        run: dotnet workload install android
      - name: Publish Avalonia Android APK
        run: dotnet publish UndertaleModToolAvalonia.Android -c Debug -r ${{ matrix.rid }} --self-contained true -p:AndroidSdkDirectory="$env:ANDROID_HOME" --output ${{ github.workspace }}\Avalonia-Android-${{ matrix.rid }}
      - name: Create Android zip
        shell: pwsh
        run: 7z a -tzip ${{ matrix.filename }}.zip ./Avalonia-Android-${{ matrix.rid }}/* -mx0
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.filename }}
          path: ${{ matrix.filename }}.zip

  upload:
    needs: [build_avalonia_android]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: Android Nightly - ${{ github.sha }}
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            */*.zip
